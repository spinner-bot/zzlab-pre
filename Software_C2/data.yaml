# YOLO 数据集配置（社区人员 / 非社区人员 / 电动车）
# 使用前需先标注数据：每张图生成一个 .txt（class_id cx cy w h，归一化坐标），
# 放到 labels/train、labels/val 下，与 images/train、images/val 对应。
#
# 标注工具建议：LabelImg / labelme / Roboflow，导出为 YOLO 格式。
# 类编号：0=社区人员(community) 1=非社区人员(non_community) 2=电动车(electrocar)

path: ./               # 数据集根目录（相对或绝对）
train: images/train
val:   images/val

names:
  0: community
  1: non_community
  2: electrocar
